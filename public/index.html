<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Price Scan · Tan Phu APG</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-brand">
          <div>
            <div class="brand-mark">
              <a href="https://tanphuapg.com" target="_blank" rel="noopener">TAN PHU APG</a>
              <span class="brand-sep">▸</span>
              <span>Price Scan</span>
            </div>
            <p id="systemStatus">Backend status: checking…</p>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="api-key-wrap">
            <input id="apiKeyInput" class="api-key-input" type="password" placeholder="API key">
            <button id="toggleApiKeyBtn" type="button" class="icon-btn" title="Hiện/ẩn API key">👁</button>
          </div>
          <button id="saveApiKeyBtn" type="button">Save key</button>
          <button id="notifyTestBtn" type="button">Test Notify</button>
          <button id="themeToggleBtn" type="button" class="icon-btn theme-toggle" title="Đổi sáng/tối">🌗</button>
        </div>
      </header>

      <section class="apg-stats" id="apgStats">
        <div class="apg-stat" data-stat="total">
          <div class="stat-label">Total jobs</div>
          <div class="stat-value">—</div>
          <div class="stat-sub">—</div>
        </div>
        <div class="apg-stat stat-active" data-stat="active">
          <div class="stat-label">Active</div>
          <div class="stat-value">—</div>
          <div class="stat-sub">đang lên lịch</div>
        </div>
        <div class="apg-stat stat-next" data-stat="next">
          <div class="stat-label">Next run</div>
          <div class="stat-value">—</div>
          <div class="stat-sub">job gần nhất</div>
        </div>
        <div class="apg-stat stat-fails" data-stat="fails">
          <div class="stat-label">Notify fails 24h</div>
          <div class="stat-value">—</div>
          <div class="stat-sub">scan lỗi gần đây</div>
        </div>
      </section>

      <main class="layout">
        <section class="panel form-panel">
          <div class="panel-title">
            <h2>Scan Job</h2>
            <button id="newJobBtn" type="button">+ New</button>
          </div>

          <form id="jobForm" class="job-form">
            <input id="jobId" type="hidden">

            <label>
              Tên job
              <input id="jobName" type="text" placeholder="VJ125 HAN-SGN">
            </label>

            <div class="grid-2">
              <label>
                From
                <input id="fromInput" type="text" maxlength="3" value="HAN" required>
              </label>
              <label>
                To
                <input id="toInput" type="text" maxlength="3" value="SGN" required>
              </label>
            </div>

            <div class="grid-2">
              <label>
                Ngày bay
                <input id="dateInput" type="date" required>
              </label>
              <label>
                Hãng
                <input id="airlineInput" type="text" maxlength="3" value="VJ">
              </label>
            </div>

            <div class="grid-2">
              <label>
                Số hiệu
                <input id="flightInput" type="text" value="VJ125">
              </label>
              <label>
                Giờ chính xác
                <input id="timeInput" type="time">
              </label>
            </div>

            <div class="grid-2">
              <label>
                Time from
                <input id="timeStartInput" type="time" value="06:00">
              </label>
              <label>
                Time to
                <input id="timeEndInput" type="time" value="12:00">
              </label>
            </div>

            <div class="grid-2">
              <label>
                Interval
                <input id="intervalInput" type="number" min="5" step="1" value="60" required>
              </label>
              <label>
                Đơn vị
                <select id="intervalUnitInput">
                  <option value="minutes">Minutes</option>
                  <option value="seconds">Seconds</option>
                </select>
              </label>
            </div>

            <div class="grid-2">
              <label>
                Notify mode
                <select id="notifyModeInput">
                  <option value="every_run">Every run</option>
                  <option value="on_change">On change</option>
                </select>
              </label>
              <div class="field">
                Kênh báo
                <input id="notifyChannelInput" type="hidden" value="telegram">
                <div class="channel-switch" role="group" aria-label="Kênh báo">
                  <button type="button" class="channel-option active" data-channel="telegram">Telegram</button>
                  <button type="button" class="channel-option" data-channel="zalo">Zalo</button>
                </div>
              </div>
            </div>

            <div class="grid-2">
              <label>
                Số khách
                <input id="adultInput" type="number" min="1" step="1" value="1" required>
              </label>
              <label>
                Trạng thái kênh
                <input id="notifyStatusInput" type="text" value="Telegram" disabled>
              </label>
            </div>

            <div class="toggles">
              <label class="inline-check">
                <input id="enabledInput" type="checkbox" checked>
                Enabled
              </label>
              <label class="inline-check">
                <input id="telegramInput" type="checkbox" checked>
                Notifications
              </label>
              <label class="inline-check">
                <input id="muteInput" type="checkbox">
                Mute (vẫn quét, không báo)
              </label>
              <label class="inline-check">
                <input id="directInput" type="checkbox" checked>
                Direct only
              </label>
            </div>

            <div class="form-actions">
              <button type="submit">Save job</button>
              <button id="runNowBtn" type="button">Run now</button>
              <button id="deleteJobBtn" class="danger" type="button">Delete</button>
            </div>
          </form>
        </section>

        <section class="panel jobs-panel">
          <div class="panel-title">
            <h2>Jobs</h2>
            <button id="refreshBtn" type="button">↻ Refresh</button>
          </div>
          <div id="jobsList" class="jobs-list"></div>
        </section>

        <section class="panel runs-panel">
          <div class="panel-title">
            <h2>History</h2>
            <span id="retentionLabel" class="muted"></span>
          </div>
          <div id="runsList" class="runs-list"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="/static/app.js"></script>
  </body>
</html>
